<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Ranger Monitor AI - Solo View</title>

  <style>
    :root {
      --bg-dark-green: #0b1a03;
      --frame-bg: #1a2e11;
      --label-bg: rgba(0, 0, 0, 0.7);
      --accent-green: #8bc34a;
    }

    body {
      margin: 0;
      padding: 0;
      background-color: var(--bg-dark-green);
      font-family: "Segoe UI", sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      height: 100vh;
      color: white;
      overflow: hidden;
    }

    header {
      width: 100%;
      padding: 20px 0;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      z-index: 5;
    }

    .back-btn {
      position: absolute;
      left: 20px;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: white;
      padding: 8px 15px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
    }

    .monitor-grid {
      width: 95%;
      flex-grow: 1;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
      margin-bottom: 25px;
    }

    .cam-frame {
      position: relative;
      background: var(--frame-bg);
      border-radius: 15px;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      overflow: hidden;
    }

    .cam-frame:hover {
      border: 1px solid var(--accent-green);
    }

    .cam-frame.fullscreen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 9999;
      border-radius: 0;
      background: black;
    }

    .exit-fs {
      display: none;
      position: absolute;
      top: 20px;
      left: 20px;
      background: var(--label-bg);
      border: 1px solid white;
      color: white;
      padding: 10px 20px;
      border-radius: 8px;
      font-weight: bold;
      z-index: 10001;
    }

    .cam-frame.fullscreen .exit-fs {
      display: block;
    }

    .cam-label {
      position: absolute;
      top: 15px;
      left: 15px;
      background: var(--label-bg);
      padding: 6px 14px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: bold;
      border-left: 3px solid var(--accent-green);
    }

    /* 🔥 ADD */
    #label-container {
      margin-top: 10px;
      font-size: 18px;
      font-weight: bold;
    }

    canvas {
      max-width: 100%;
      border-radius: 10px;
    }

    /* Settings Button & Layout */
    .header-btns {
      position: absolute;
      right: 20px;
      display: flex;
      gap: 10px;
    }

    .settings-btn {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: white;
      padding: 8px 15px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.3s ease;
    }

    .settings-btn:hover {
      background: var(--accent-green);
      color: #0b1a03;
      border-color: var(--accent-green);
      box-shadow: 0 0 10px rgba(139, 195, 74, 0.5);
    }

    /* Glassmorphic Settings Modal */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(8px);
      z-index: 10000;
      justify-content: center;
      align-items: center;
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .modal-overlay.active {
      display: flex;
      opacity: 1;
    }

    .settings-modal {
      background: rgba(26, 46, 17, 0.95);
      border: 1px solid var(--accent-green);
      border-radius: 16px;
      padding: 30px;
      width: 90%;
      max-width: 500px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5), 0 0 15px rgba(139, 195, 74, 0.2);
      transform: translateY(-20px);
      transition: transform 0.3s ease;
      position: relative;
    }

    .modal-overlay.active .settings-modal {
      transform: translateY(0);
    }

    .modal-title {
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 20px;
      color: var(--accent-green);
      border-bottom: 1px solid rgba(139, 195, 74, 0.2);
      padding-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .modal-close {
      position: absolute;
      top: 20px;
      right: 20px;
      background: none;
      border: none;
      color: #aaa;
      font-size: 24px;
      cursor: pointer;
      transition: color 0.2s;
    }

    .modal-close:hover {
      color: white;
    }

    .form-group {
      margin-bottom: 20px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .form-group label {
      font-size: 14px;
      font-weight: 600;
      color: #e0e0e0;
      text-align: left;
    }

    .form-group input {
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 8px;
      padding: 10px 12px;
      color: white;
      font-size: 14px;
      font-family: inherit;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .form-group input:focus {
      outline: none;
      border-color: var(--accent-green);
      box-shadow: 0 0 8px rgba(139, 195, 74, 0.3);
    }

    .modal-footer {
      display: flex;
      justify-content: flex-end;
      gap: 12px;
      margin-top: 25px;
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: white;
      padding: 10px 20px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.2);
    }

    .btn-primary {
      background: var(--accent-green);
      border: none;
      color: #0b1a03;
      padding: 10px 20px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .btn-primary:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(139, 195, 74, 0.4);
    }

    /* Toast notification */
    .toast {
      position: fixed;
      bottom: -100px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(139, 195, 74, 0.95);
      color: #0b1a03;
      padding: 12px 24px;
      border-radius: 8px;
      font-weight: bold;
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
      z-index: 10005;
      transition: bottom 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .toast.show {
      bottom: 30px;
    }
  </style>
</head>

<body>

<header>
  <button class="back-btn" onclick="location.href='/'">Back</button>
  <div style="font-size:22px;font-weight:600;">🌿 Ranger Monitor AI</div>
  <div class="header-btns">
    <button class="settings-btn" onclick="openSettings()">⚙️ Settings</button>
  </div>
</header>

<main class="monitor-grid">

  <!-- CAM 1 (AI CAMERA) -->
  <div class="cam-frame" id="cam1" onclick="openFull(this)">
    <button class="exit-fs" onclick="closeFull(event, 'cam1')">❮ Exit</button>
    <div class="cam-label">AI CAM</div>

    <!-- 🔥 FIX: stop click + layout -->
    <div onclick="event.stopPropagation()" style="text-align:center; width:100%;">

      <!-- Hidden image stream -->
      <img id="ipcam"
           src=""
           crossorigin="anonymous"
           style="display:none;" />

      <!-- Canvas -->
      <canvas id="canvas" width="400" height="300"></canvas>

      <!-- 🔥 ADD loading text -->
      <div id="label-container">⏳ Đang khởi động AI...</div>

    </div>
  </div>

  <!-- CAM 2 (IP CAMERA) -->
  <div class="cam-frame" id="cam2" onclick="openFull(this)">
    <button class="exit-fs" onclick="closeFull(event, 'cam2')">❮ Exit</button>
    <div class="cam-label">CAM 2</div>

    <img id="cam2-img" src="" width="100%" />
  </div>

</main>

<!-- SETTINGS MODAL -->
<div class="modal-overlay" id="settingsOverlay" onclick="closeSettings(event)">
  <div class="settings-modal" onclick="event.stopPropagation()">
    <button class="modal-close" onclick="closeSettings()">&times;</button>
    <div class="modal-title">⚙️ Camera IP Configuration</div>
    
    <div class="form-group">
      <label for="cam1-url">AI Camera Stream URL</label>
      <input type="text" id="cam1-url" placeholder="http://192.168.1.4:8080/video" />
    </div>
    
    <div class="form-group">
      <label for="cam2-url">CAM 2 Stream URL</label>
      <input type="text" id="cam2-url" placeholder="http://192.168.110.227:8080/video" />
    </div>
    
    <div class="modal-footer">
      <button class="btn-secondary" onclick="resetToDefaults()">Reset Defaults</button>
      <button class="btn-primary" onclick="saveSettings()">Save Changes</button>
    </div>
  </div>
</div>

<!-- TOAST NOTIFICATION -->
<div class="toast" id="toast">
  <span>✅ Saved settings successfully!</span>
</div>

<!-- DYNAMIC IP INITIALIZATION & MODAL LOGIC -->
<script>
  const DEFAULT_CAM1 = "http://192.168.1.4:8080/video";
  const DEFAULT_CAM2 = "http://192.168.110.227:8080/video";

  // Load saved values or fall back to defaults
  let currentCam1 = localStorage.getItem("cam1_url") || DEFAULT_CAM1;
  let currentCam2 = localStorage.getItem("cam2_url") || DEFAULT_CAM2;

  // Apply URLs immediately so they are ready when DOMContentLoaded fires
  const ipCamImg = document.getElementById("ipcam");
  const cam2Img = document.getElementById("cam2-img");
  if (ipCamImg) ipCamImg.src = currentCam1;
  if (cam2Img) cam2Img.src = currentCam2;

  // Pre-populate input values in the modal
  document.getElementById("cam1-url").value = currentCam1;
  document.getElementById("cam2-url").value = currentCam2;

  function openSettings() {
    const overlay = document.getElementById("settingsOverlay");
    overlay.style.display = "flex";
    // Trigger reflow to run transition
    void overlay.offsetWidth;
    overlay.classList.add("active");
  }

  function closeSettings(event) {
    const overlay = document.getElementById("settingsOverlay");
    overlay.classList.remove("active");
    setTimeout(() => {
      overlay.style.display = "none";
    }, 300);
  }

  function saveSettings() {
    const cam1Input = document.getElementById("cam1-url").value.trim() || DEFAULT_CAM1;
    const cam2Input = document.getElementById("cam2-url").value.trim() || DEFAULT_CAM2;

    localStorage.setItem("cam1_url", cam1Input);
    localStorage.setItem("cam2_url", cam2Input);

    currentCam1 = cam1Input;
    currentCam2 = cam2Input;

    // Update images dynamically
    if (ipCamImg) ipCamImg.src = currentCam1;
    if (cam2Img) cam2Img.src = currentCam2;

    closeSettings();
    showToast();
  }

  function resetToDefaults() {
    document.getElementById("cam1-url").value = DEFAULT_CAM1;
    document.getElementById("cam2-url").value = DEFAULT_CAM2;
  }

  function showToast() {
    const toast = document.getElementById("toast");
    toast.classList.add("show");
    setTimeout(() => {
      toast.classList.remove("show");
    }, 3000);
  }
</script>

<!-- FULLSCREEN SCRIPT -->
<script>
function openFull(el) {
  if (!el.classList.contains("fullscreen")) {
    el.classList.add("fullscreen");
  }
}

function closeFull(event, id) {
  event.stopPropagation();
  document.getElementById(id).classList.remove("fullscreen");
}
</script>

<!-- YOUR JS -->
<script src="/static/index.js"></script>

</body>
</html>
